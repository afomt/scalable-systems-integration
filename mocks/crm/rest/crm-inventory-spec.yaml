openapi: 3.0.0
info:
  title: E-commerce Integration Mock API
  version: 1.0.0
paths:
  /customers:
    get:
      summary: Fetch customer data
      responses:
        '200':
          description: A list of customers
          content:
            application/json:
              example:
                - id: "C001"
                  name: "Alice Smith"
                  email: "alice@example.com"
    post:
      summary: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: "Bob Jones"
              email: "bob@example.com"
      responses:
        '201':
          description: Customer created
  /products:
    get:
      summary: Fetch product stock
      responses:
        '200':
          description: Inventory list
          content:
            application/json:
              example:
                - sku: "PROD-001"
                  stock_level: 50
                  price: 29.99
  /analytics/data:
    post:
      responses:
        '200':
          description: Accepted