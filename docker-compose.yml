services:

  # -----------------------------
  # CRM REST MOCK
  # -----------------------------
  crm-rest-mock:
    image: stoplight/prism:4
    container_name: crm-rest-mock
    command: mock -h 0.0.0.0 /public/api.yaml
    volumes:
      - ./mocks/crm/rest/crm-inventory-spec.yaml:/public/api.yaml
    ports:
      - "3001:4010"
  inventory-rest-mock:
    image: stoplight/prism:4
    container_name: inventory-rest-mock
    command: mock -h 0.0.0.0 /public/api.yaml
    volumes:
      - ./mocks/inventory/rest/inventory-spec.yaml:/public/api.yaml
    ports:
      - "3002:4010"

  # -----------------------------
  # CRM SOAP MOCK
  # -----------------------------
  crm-soap-mock:
    build: ./mocks/crm/soap
    container_name: crm-soap-mock
    ports:
      - "8011:8000"

  # -----------------------------
  # ANALYTICS MOCK
  # -----------------------------
  analytics-mock:
    build: ./mocks/analytics
    container_name: analytics-mock
    ports:
      - "9000:9000"

  # -----------------------------
  # ZOOKEEPER
  # -----------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # -----------------------------
  # KAFKA
  # -----------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Only one listener port: 9092 for both internal + external
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"


# REDIS 
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"


  # -----------------------------
  # KAFKA UI
  # -----------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  # -----------------------------
  # JAVA PRODUCER SERVICE
  # -----------------------------
  producer-service:
    build: ./producer-service
    container_name: producer-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
      crm-rest-mock:
        condition: service_started
      crm-soap-mock:
        condition: service_started
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CRM_REST_URL: http://crm-rest-mock:4010
      CRM_SOAP_URL: http://crm-soap-mock:8000/?wsdl

  consumer-service:
    build: ./consumer-service
    container_name: consumer-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_started
      analytics-mock:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_URL: redis://redis:6379
      ANALYTICS_URL: http://analytics-mock:9000/analytics/data
